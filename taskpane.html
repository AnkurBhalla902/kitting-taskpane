<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kitting Flow</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
<div id="app">

  <!-- Top combined bar — brand + tabs in one slim row -->
  <header class="top-bar">
    <div class="brand-mini">
      <div class="logo">K</div>
    </div>
    <nav class="tab-bar">
      <button class="tab active" data-view="browse">Browse</button>
      <button class="tab" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="week">Week</button>
    </nav>
    <div class="header-actions">
      <button id="wide-btn" class="btn-mini" title="Toggle wide table view (drag the pane wider first)">⊞ Wide</button>
      <button id="new-row-btn" class="btn-mini-primary" title="Add a new row">+ New</button>
      <button id="refresh-btn" class="btn-mini" title="Refresh">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
    </div>
  </header>

  <!-- ── BROWSE ── -->
  <section id="view-browse" class="view active">
    <div class="search-bar">
      <div class="search-wrap">
        <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" type="search" placeholder="Search loanset, module, hospital, PO, FID…" />
      </div>
      <button id="filter-toggle" class="btn-mini btn-filter" title="Filters" aria-expanded="false">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
        <span id="filter-badge" class="filter-badge hidden">0</span>
      </button>
      <span id="result-count" class="result-pill"></span>
    </div>

    <div id="filter-panel" class="filter-panel" aria-hidden="true">
      <div class="filter-panel-inner">
        <div class="slicer-row">
          <div class="slicer-label">Alloc</div>
          <div class="slicer-pills">
            <button class="pill active" data-slicer="alloc" data-val="">All</button>
            <button class="pill" data-slicer="alloc" data-val="allocated">Allocated</button>
            <button class="pill" data-slicer="alloc" data-val="not-allocated">Not allocated</button>
          </div>
        </div>
        <div class="slicer-row" id="reason-row" style="display:none">
          <div class="slicer-label">Reason</div>
          <div class="slicer-pills">
            <button class="pill active" data-slicer="reason" data-val="">All</button>
            <button class="pill" data-slicer="reason" data-val="FORECAST ORDER">Forecast</button>
            <button class="pill" data-slicer="reason" data-val="ORTHOKIT">OrthoKit</button>
            <button class="pill" data-slicer="reason" data-val="Enter Ship To">Pending</button>
            <button class="pill" data-slicer="reason" data-val="Not in Hospital Master">Not in master</button>
          </div>
        </div>
        <div class="slicer-row">
          <div class="slicer-label">Quick</div>
          <div class="slicer-pills">
            <button class="pill pill-toggle active" id="toggle-hide-shipped">Hide shipped</button>
            <button class="pill pill-toggle" id="toggle-only-issues">Issues only</button>
          </div>
        </div>
        <div class="filter-grid">
          <select id="filter-bu" class="filter"><option value="">All BUs</option></select>
          <select id="filter-status" class="filter"><option value="">Any status</option></select>
          <select id="filter-week-in" class="filter"><option value="">Any inbound week</option></select>
          <div class="sap-search-wrap">
            <input id="filter-sap" type="search" class="filter sap-input" placeholder="SAP module…" autocomplete="off" />
          </div>
        </div>
        <div class="filter-clear-row">
          <button id="clear-filters" class="btn-link">Clear all filters</button>
        </div>
      </div>
    </div>

    <main id="results">
      <div id="empty-state" class="empty-state"><p>Loading…</p></div>
      <div id="rows-container" class="rows-container hidden"></div>
      <div id="pagination" class="pagination hidden">
        <button id="prev-page" class="btn-page">‹</button>
        <span id="page-info" class="page-info"></span>
        <button id="next-page" class="btn-page">›</button>
      </div>
    </main>
  </section>

  <!-- ── DASHBOARD ── -->
  <section id="view-dashboard" class="view">
    <div id="dashboard-content" class="dashboard">
      <p class="empty-state">Load data to see dashboard.</p>
    </div>
  </section>

  <!-- ── WEEK VIEW ── -->
  <section id="view-week" class="view">
    <div class="week-mini-header">
      <strong id="week-current-label">Current week</strong>
      <span class="muted" id="week-config-info"></span>
    </div>
    <div id="week-columns" class="week-columns">
      <p class="empty-state">Load data to see week view.</p>
    </div>
  </section>

  <!-- Detail drawer -->
  <aside id="detail-drawer" class="drawer hidden">
    <div class="drawer-header">
      <h2 id="detail-title">Module details</h2>
      <button id="close-drawer" class="btn-icon" aria-label="Close">×</button>
    </div>
    <div class="drawer-body">
      <div id="detail-fields"></div>
    </div>
    <div class="drawer-footer">
      <button id="dup-row" class="btn-secondary" title="Copy this row's values into a new row below it">⧉ Copy to new row</button>
      <span style="flex:1"></span>
      <button id="cancel-edit" class="btn-secondary">Cancel</button>
      <button id="save-edit" class="btn-primary">Save changes</button>
    </div>
    <div id="validation-msg" class="validation-msg hidden"></div>
  </aside>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="taskpane.js"></script>
</body>
</html>
